name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# The plugin is bash hooks + zero-dependency node (.mjs) + markdown. There is no
# build step and no npm dependency tree, so CI runs on Linux only (the hooks are
# bash; a Windows runner cannot `bash -n` them meaningfully).
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate manifests + bin scripts + bundled tests
        run: node scripts/ci-validate.mjs

      - name: Shell syntax check (bash -n) on every hook
        shell: bash
        run: |
          set -e
          found=0
          for f in $(find hooks -name '*.sh' 2>/dev/null); do
            found=1
            bash -n "$f" && echo "bash -n OK: $f"
          done
          if [ "$found" = "0" ]; then echo "no hooks yet (bootstrap) — skipping"; fi

      - name: Smoke tests (hooks/_smoke/*.sh, if any)
        shell: bash
        run: |
          set -e
          found=0
          for f in $(find hooks/_smoke -name '*.sh' 2>/dev/null); do
            found=1
            echo "running $f"
            CLAUDE_PLUGIN_ROOT="$GITHUB_WORKSPACE" bash "$f"
          done
          if [ "$found" = "0" ]; then echo "no smoke tests yet (bootstrap) — skipping"; fi

      # The PREVENTION half of #2205. Fixing the one step below stops that step; this stops the NEXT
      # one. It flags any step scoped to the push event inside a workflow that also runs on
      # pull_request — the exact shape below used to have — unless the step states, in a
      # `# push-only-ok:` comment, why it is a genuine post-merge action rather than a gate.
      # Deliberately runs on BOTH events: a lint that only ran post-merge would be the very defect
      # it exists to catch.
      - name: No push-only merge gates (#2205 prevention)
        run: node scripts/check-push-only-gates.mjs

      # #2205 — this step used to carry `if: github.event_name == 'push'`, which made it
      # STRUCTURALLY incapable of preventing anything. It ran only AFTER a merge landed on master,
      # at which point the subject is immutable without a history rewrite. MEASURED 2026-08-01:
      # 17 of the last 20 origin/master first-parent commits FAILED it, and it blocked exactly zero
      # of them; on PR #78's own run (30681721306) this step's conclusion was literally `skipped`.
      # A check that can only run after the irreversible step is a reporter, not a gate.
      #
      # WHY IT CANNOT SIMPLY BE UN-SCOPED — the trap that makes the naive fix vacuous. On a
      # pull_request event the checked-out HEAD is GitHub's SYNTHETIC merge ref, whose subject is
      # "Merge <sha> into <sha>". That matches the `^Merge ` exemption below, so a bare removal of
      # the `if:` would make every PR run exit 0 having validated a string no human wrote — green,
      # and blind. The only surface with real pre-merge power is the PR TITLE, because this repo
      # squash-merges and the PR title BECOMES the master subject (verified: PR #78's title is
      # byte-for-byte the subject of e28e060, modulo the trailing " (#78)"). So the event selects
      # WHICH string to validate; the grammar is shared by both arms.
      - name: Validate commit message (Conventional Commits)
        shell: bash
        # Passed via `env:`, never interpolated into the script body — a PR title is
        # attacker-controlled text and `${{ }}` inside `run:` is a shell-injection sink.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            SUBJECT="$PR_TITLE"
            SRC="PR title (becomes the squash-merge subject on master)"
          else
            SUBJECT="$(git log -1 --pretty=%s)"
            SRC="HEAD commit subject"
          fi

          # A true (non-squash) merge commit carries a subject no author chose, so it is exempt.
          # Deliberately scoped to push: on pull_request the title is never auto-generated, so this
          # arm can never mask a badly-titled PR — which is exactly how the old un-scoped form
          # would have failed open.
          if [ "$GITHUB_EVENT_NAME" = "push" ] && printf '%s' "$SUBJECT" | grep -qE "^Merge "; then
            echo "skipped: true merge commit — subject is not author-chosen"
            exit 0
          fi

          # `sync` is first-class here, not a concession. This repo is the PUBLIC mirror of a private
          # canonical source, and `sync:` is the established prefix for every lockstep port (17 of the
          # last 20 master commits used it). The type list was simply never taught about the one
          # commit class this repo produces most.
          if ! printf '%s' "$SUBJECT" | grep -qE "^(feat|fix|docs|chore|refactor|test|style|perf|ci|build|revert|sync)(\(.+\))?(!)?: .+"; then
            echo "ERROR: $SRC is not Conventional Commits format."
            echo "  Got: $SUBJECT"
            echo "  Expected: <type>[(scope)][!]: <description>"
            echo "  Types: feat fix docs chore refactor test style perf ci build revert sync"
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "  Fix: edit the PR title. It becomes the commit subject when this is squash-merged."
            fi
            exit 1
          fi
          echo "commit message OK ($SRC): $SUBJECT"
